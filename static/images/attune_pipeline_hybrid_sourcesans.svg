  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="1026" y="445" font-size="8" fill="#22303A">• pattern use in Phase 4</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="1026" y="457" font-size="8" fill="#22303A">• auto-annotation reflection</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="1026" y="472" font-size="7.4" font-style="italic" fill="#9AA0A6">+ pattern library &amp; history</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="1026" y="490" font-size="9" font-weight="700" fill="#9A7517">▸ operator attention</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="1026" y="500" font-size="9" font-weight="700" fill="#9A7517">   profile</text>
