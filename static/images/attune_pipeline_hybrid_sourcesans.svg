  <line x1="645" y1="140" x2="664" y2="140" stroke="#55606B" stroke-width="1.5" marker-end="url(#fa)"/>
  <line x1="825" y1="140" x2="844" y2="140" stroke="#55606B" stroke-width="1.5" marker-end="url(#fa)"/>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="564" y="212" font-size="8.8" font-style="italic" fill="#3F7A57" text-anchor="middle">runs once per participant · favors stronger semantic reasoning</text>

