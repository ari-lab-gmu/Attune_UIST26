  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="322" y="434" font-size="8.5" fill="#22303A">+ YOLO visual cues</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="322" y="447" font-size="8.5" fill="#22303A">+ gaze timing features</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="322" y="460" font-size="8.5" fill="#8A5A22" font-weight="600">+ reviewed pattern library</text>
