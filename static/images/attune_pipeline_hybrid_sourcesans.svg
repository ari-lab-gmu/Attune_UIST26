  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="576" y="428" font-size="10" font-weight="700" fill="#22303A" text-anchor="middle">Versatile</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="576" y="444" font-size="8.6" fill="#4A3E70" text-anchor="middle">suggestion generation</text>
