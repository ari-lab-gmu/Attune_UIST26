  <rect x="296" y="312" width="706" height="196" rx="12" fill="#F2F1F7" stroke="#DEDAE8" stroke-width="1"/>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="306" y="74" font-size="13" font-weight="700" fill="#2E6A47">PHASE 3 · Pattern Inference</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="516" y="74" font-size="10" font-style="italic" fill="#6B6B6B">runs once per participant</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="306" y="332" font-size="13" font-weight="700" fill="#54468A">PHASE 4 · Pattern-Guided Auto-Annotation</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="612" y="332" font-size="10" font-style="italic" fill="#6B6B6B">high-throughput, per shift</text>

  <!-- ================= COMPACT PHASE 1 ================= -->
  <rect x="16" y="96" width="118" height="96" rx="9" fill="#EAF0F5" stroke="#5B7A99" stroke-width="1.4"/>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="26" y="116" font-size="8.5" font-weight="700" letter-spacing="1" fill="#3E607F">PHASE 1</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="26" y="132" font-size="11.5" font-weight="700" fill="#22303A">Sensemaking</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="26" y="149" font-size="8.3" fill="#6B6B6B">6 feeds · eye tracker</text>
  <line x1="26" y1="158" x2="124" y2="158" stroke="#C4D3DF" stroke-width="1"/>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="26" y="180" font-size="8.7" font-weight="700" fill="#3E607F">▸ gaze + robot</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="26" y="190" font-size="8.7" font-weight="700" fill="#3E607F">   context</text>

  <!-- ================= COMPACT PHASE 2 ================= -->
  <rect x="150" y="96" width="132" height="96" rx="9" fill="#E7F1EF" stroke="#4E8479" stroke-width="1.4"/>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="160" y="116" font-size="8.5" font-weight="700" letter-spacing="1" fill="#37665C">PHASE 2</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="160" y="132" font-size="11.5" font-weight="700" fill="#22303A">Gaze-Shift Annot.</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="160" y="149" font-size="8.3" fill="#6B6B6B">operator explains shifts</text>
  <line x1="160" y1="158" x2="272" y2="158" stroke="#BFDDD6" stroke-width="1"/>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="160" y="180" font-size="8.7" font-weight="700" fill="#37665C">▸ annotated gaze</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="160" y="190" font-size="8.7" font-weight="700" fill="#37665C">   shifts</text>

