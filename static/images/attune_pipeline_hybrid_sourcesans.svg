  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="758" y="422" font-size="8.3" fill="#22303A" text-anchor="middle">· why arrive</text>
  <text font-family="'Source Sans 3', 'Source Sans Pro', 'Source Sans', sans-serif" x="758" y="435" font-size="7.9" fill="#6B6B6B" text-anchor="middle">each + confidence + expl.</text>
